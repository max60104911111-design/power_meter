<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>彰化大田 - 系統登入</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f1a;
    --panel: #111827;
    --panel2: #0d1520;
    --border: #1e2d42;
    --accent: #00d4a0;
    --accent2: #00b8e6;
    --text: #e2e8f0;
    --muted: #64748b;
    --danger: #ef4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: 'Noto Sans TC', sans-serif;
    background:
      radial-gradient(circle at top left, rgba(0, 212, 160, 0.08), transparent 28%),
      radial-gradient(circle at bottom right, rgba(0, 184, 230, 0.08), transparent 32%),
      linear-gradient(135deg, #08111d 0%, #0a0f1a 45%, #08131f 100%);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
    position: relative;
  }

  body::before,
  body::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  body::before {
    background-image:
      linear-gradient(rgba(30,45,66,0.35) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30,45,66,0.35) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: linear-gradient(to bottom, rgba(255,255,255,0.18), rgba(255,255,255,0.02));
  }

  body::after {
    background: linear-gradient(90deg, transparent 0%, rgba(0,212,160,0.04) 50%, transparent 100%);
    transform: skewY(-8deg);
  }

  .login-wrap {
    width: 100%;
    max-width: 420px;
    position: relative;
    z-index: 1;
  }

  .brand-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    padding: 6px 10px;
    border: 1px solid rgba(0, 212, 160, 0.24);
    border-radius: 999px;
    background: rgba(0, 212, 160, 0.07);
    color: var(--accent);
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 1px;
  }

  .brand-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(0, 212, 160, 0.55);
  }

  .login-card {
    background: rgba(17, 24, 39, 0.92);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 30px 28px 26px;
    box-shadow:
      0 24px 60px rgba(0, 0, 0, 0.35),
      0 0 0 1px rgba(0, 212, 160, 0.02) inset;
    backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
  }

  .login-card::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0, 212, 160, 0.45), transparent);
  }

  .login-card::after {
    content: "";
    position: absolute;
    width: 220px;
    height: 220px;
    right: -120px;
    top: -120px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 184, 230, 0.16), transparent 65%);
    pointer-events: none;
  }

  .login-header {
    margin-bottom: 24px;
    position: relative;
    z-index: 1;
  }

  .login-title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .login-subtitle {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.7;
  }

  .form-group {
    margin-bottom: 18px;
    position: relative;
    z-index: 1;
  }

  .form-label {
    display: block;
    margin-bottom: 8px;
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }

  .form-input {
    width: 100%;
    height: 46px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    padding: 0 14px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }

  .form-input::placeholder {
    color: #506178;
  }

  .form-input:focus {
    border-color: rgba(0, 212, 160, 0.6);
    box-shadow: 0 0 0 3px rgba(0, 212, 160, 0.12);
    background: #0f1927;
  }

  .check-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 4px 0 20px;
    position: relative;
    z-index: 1;
  }

  .check-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    user-select: none;
  }

  .check-label input {
    accent-color: var(--accent);
    width: 15px;
    height: 15px;
  }

  .login-btn {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #04131b;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    position: relative;
    z-index: 1;
    box-shadow: 0 10px 24px rgba(0, 184, 230, 0.18);
  }

  .login-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 14px 28px rgba(0, 184, 230, 0.22);
  }

  .login-btn:active {
    transform: translateY(0);
    opacity: 0.96;
  }

  .bottom-note {
    margin-top: 14px;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.5px;
  }

  @media (max-width: 520px) {
    .login-card {
      padding: 24px 20px 22px;
      border-radius: 16px;
    }

    .login-title {
      font-size: 22px;
    }
  }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="brand-badge">
      <span class="brand-dot"></span>
      ENERGY MONITORING SYSTEM
    </div>

    <div class="login-card">
      <div class="login-header">
        <div class="login-title">彰化大田</div>
        <div class="login-subtitle">能源監控系統登入</div>
      </div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="username">帳號</label>
          <input class="form-input" id="username" type="text" placeholder="請輸入帳號">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">密碼</label>
          <input class="form-input" id="password" type="password" placeholder="請輸入密碼">
        </div>

        <div class="check-row">
          <label class="check-label">
            <input type="checkbox" id="rememberMe">
            <span>記住我</span>
          </label>
        </div>

        <button class="login-btn" type="submit">登入</button>
      </form>
    </div>

    <div class="bottom-note">SECURE ACCESS / LIVE ENERGY DASHBOARD</div>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) {
        alert('請輸入帳號與密碼');
        return;
      }

      alert('已送出登入');
    }
  </script>
</body>
</html>
